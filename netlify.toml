# REBUSS OPS — Configuração de Build e Deploy Netlify

[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=optional"

# Configuração explícita do bundler das Functions para ES Modules (Node 20 + esbuild)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  minify = true
  included_files = ["generated/**"]
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg", "bcryptjs"]



# Redirecionar todas as chamadas /api/* para a função serverless Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback SPA para index.html em todas as outras rotas
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança e otimização de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
